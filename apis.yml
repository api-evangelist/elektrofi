name: Elektrofi
description: >-
  Elektrofi is a Boston-based biopharmaceutical formulation technology company
  reinventing how biologic therapies are delivered to patients. Its Hypercon
  ultra-high-concentration microparticle platform and Elektroject process turn
  monoclonal antibodies, therapeutic proteins, and other large-molecule drugs
  into stable, syringe-injectable formulations suited to small-volume, at-home
  subcutaneous self-administration instead of intravenous infusion. The company
  has partnered with Eli Lilly and Janssen Biotech (Johnson & Johnson) on
  multi-target drug-delivery collaborations, and was acquired by Halozyme
  Therapeutics in November 2025. Elektrofi is a biotechnology company and does
  not publish a public developer API; this API Evangelist profile tracks it as a
  company entity within the network.
